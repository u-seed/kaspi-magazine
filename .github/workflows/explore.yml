name: explore-kaspi
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/explore.py || echo "FAILED $?" > explore-result.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add explore-result.txt sample-list.json sample-product.html || true
          git commit -m "explore result" || true
          git pull --rebase -q || true
          git push || true
