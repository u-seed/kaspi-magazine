name: test-kaspi
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test.py > test-out.txt 2>&1 || echo FAILED >> test-out.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "test result" || true
          git pull --rebase -q || true
          git push || true
        if: always()
