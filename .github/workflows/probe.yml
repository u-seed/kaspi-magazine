name: probe-kaspi

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if Kaspi answers from GitHub Actions
        run: |
          exec > probe-result.txt 2>&1
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          echo "--- category page"
          curl -sS -m 30 -A "$UA" -H "Accept-Language: ru-RU,ru;q=0.9" \
            -o page.html -w "HTTP %{http_code}, %{size_download} bytes\n" \
            "https://kaspi.kz/shop/c/smartphones/all/" || true
          head -c 600 page.html || true
          echo
          echo "--- product list json"
          curl -sS -m 30 -A "$UA" -H "Accept: application/json, text/*" \
            -H "Referer: https://kaspi.kz/shop/c/smartphones/all/" \
            -o list.json -w "HTTP %{http_code}, %{size_download} bytes\n" \
            "https://kaspi.kz/yml/product-view/pl/results?page=0&q=%3Acategory%3ASmartphones%3AavailableInZones%3AMagnum_ZONE1&text=&sort=relevance&qs=&ui=d&i=-1&c=750000000" || true
          head -c 600 list.json || true
          echo
      - name: Save result to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add probe-result.txt
          git commit -m "probe result" || true
          git push || true
