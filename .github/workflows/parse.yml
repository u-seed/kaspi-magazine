name: parse-kaspi
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/parse.py > parse-out.txt 2>&1 || echo "FAILED" >> parse-out.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "parse result" || true
          git pull --rebase -q || true
          git push || true
        if: always()
