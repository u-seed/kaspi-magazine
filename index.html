<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Каспи: телефоны</title>
<style>
:root{--bg:#0f1720;--card:#18222e;--line:#263444;--tx:#e8eef5;--mut:#8fa1b5;--acc:#4cc38a;--warn:#f0b34a;--link:#6cb6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:40px}
header{padding:14px 14px 6px}
h1{font-size:19px;margin:0}
.sub{color:var(--mut);font-size:12.5px;margin-top:2px}
.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 14px}
.ctrl input,.ctrl select{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px}
.ctrl .full{grid-column:1/3}
.count{padding:2px 14px 8px;color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 12px 10px;padding:12px}
.row{display:flex;gap:12px}
.card img{width:74px;height:74px;object-fit:contain;background:#fff;border-radius:10px;flex:none}
.t{font-weight:600;font-size:14.5px}
.price{font-size:19px;font-weight:700;margin-top:2px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.b{background:#10202b;border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12.5px}
.b.batt{border-color:var(--acc);color:var(--acc);font-weight:700}
.btns{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.btn{background:#10202b;color:var(--link);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:13px;text-decoration:none;cursor:pointer}
label.cmp{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mut)}
.specs{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:13px}
.specs.open{display:block}
.sec{color:var(--warn);font-weight:600;margin:8px 0 2px}
.sp{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.sp span:first-child{color:var(--mut)}
.sp span:last-child{text-align:right}
#cmpbox{margin:0 12px 12px;background:var(--card);border:1px solid var(--acc);border-radius:14px;padding:10px;display:none}
#cmpbox h2{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.tw{overflow-x:auto}
table{border-collapse:collapse;font-size:12.5px;min-width:100%}
th,td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--card)}
td.k{color:var(--mut);min-width:110px}
td.best{color:var(--acc);font-weight:700}
.empty{text-align:center;color:var(--mut);padding:30px}
</style>
</head>
<body>
<header>
  <h1>Телефоны с Kaspi</h1>
  <div class="sub" id="meta">загрузка…</div>
</header>
<div class="ctrl">
  <input class="full" id="q" placeholder="Поиск: бренд, модель, процессор" autocomplete="off">
  <select id="brand"><option value="">Все бренды</option></select>
  <select id="ram"><option value="">Любая ОЗУ</option></select>
  <input id="pmin" type="number" inputmode="numeric" placeholder="Цена от">
  <input id="pmax" type="number" inputmode="numeric" placeholder="Цена до">
  <select class="full" id="sort">
    <option value="batt">Сначала большая батарея</option>
    <option value="price">Сначала дешёвые</option>
    <option value="proc">Процессор (А–Я)</option>
    <option value="rating">Высокий рейтинг</option>
  </select>
</div>
<div class="count" id="count"></div>
<div id="cmpbox"></div>
<div id="list"></div>
<script>
let DATA=[], SEL=new Set(), OPEN=new Set();
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/&#43;/g,"+").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>Number(n).toLocaleString("ru-RU").replace(/ /g," ")+" ₸";
const num=s=>{const m=String(s||"").match(/\d+/);return m?+m[0]:0};
function spec(it,name){const s=it.specs.find(x=>x.name===name);return s?s.value:""}

async function load(){
  try{
    const r=await fetch("data.json?"+Date.now(),{cache:"no-store"});
    const d=await r.json();
    DATA=d.items;
    $("meta").textContent=`Обновлено ${d.generated} · моделей: ${d.count} · дубли убраны, оставлена самая дешёвая`;
    const brands=[...new Set(DATA.map(x=>x.brand))].sort();
    $("brand").innerHTML='<option value="">Все бренды</option>'+brands.map(b=>`<option>${esc(b)}</option>`).join("");
    const rams=[...new Set(DATA.map(x=>x.ram).filter(Boolean))].sort((a,b)=>num(a)-num(b));
    $("ram").innerHTML='<option value="">Любая ОЗУ</option>'+rams.map(b=>`<option>${esc(b)}</option>`).join("");
    render();
  }catch(e){$("meta").textContent="Не удалось загрузить data.json"}
}

function filtered(){
  const q=$("q").value.trim().toLowerCase(), br=$("brand").value, rm=$("ram").value;
  const pmin=+$("pmin").value||0, pmax=+$("pmax").value||Infinity;
  let a=DATA.filter(x=>(!br||x.brand===br)&&(!rm||x.ram===rm)&&x.price>=pmin&&x.price<=pmax&&
    (!q||(x.title+" "+x.processor).toLowerCase().includes(q)));
  const s=$("sort").value;
  if(s==="batt")a.sort((x,y)=>y.battery-x.battery||x.price-y.price);
  else if(s==="price")a.sort((x,y)=>x.price-y.price||y.battery-x.battery);
  else if(s==="proc")a.sort((x,y)=>(x.processor||"~").localeCompare(y.processor||"~")||y.battery-x.battery);
  else a.sort((x,y)=>(y.rating||0)-(x.rating||0)||x.price-y.price);
  return a;
}

function card(x){
  const sections={};
  x.specs.forEach(s=>{(sections[s.section]=sections[s.section]||[]).push(s)});
  const det=Object.entries(sections).map(([k,v])=>`<div class="sec">${esc(k)}</div>`+v.map(s=>`<div class="sp"><span>${esc(s.name)}</span><span>${esc(s.value)}</span></div>`).join("")).join("");
  return `<div class="card" data-id="${x.id}">
    <div class="row">${x.image?`<img src="${esc(x.image)}" loading="lazy" alt="">`:""}
      <div><div class="t">${esc(x.title)}</div><div class="price">${fmt(x.price)}</div></div></div>
    <div class="badges">
      <span class="b batt">🔋 ${x.battery} мАч</span>
      ${x.processor?`<span class="b">${esc(x.processor)}</span>`:""}
      ${x.ram?`<span class="b">ОЗУ ${esc(x.ram)}</span>`:""}
      ${x.storage?`<span class="b">${esc(x.storage)}</span>`:""}
      ${x.rating?`<span class="b">★ ${x.rating}</span>`:""}
    </div>
    <div class="btns">
      <a class="btn" href="${esc(x.url)}" target="_blank" rel="noopener">Открыть в Kaspi</a>
      <button class="btn" data-act="det">Характеристики</button>
      <label class="cmp"><input type="checkbox" data-act="cmp" ${SEL.has(x.id)?"checked":""}> сравнить</label>
    </div>
    <div class="specs ${OPEN.has(x.id)?"open":""}">${det}</div>
  </div>`;
}

function render(){
  const a=filtered();
  $("count").textContent=`Показано: ${a.length} из ${DATA.length}`;
  $("list").innerHTML=a.length?a.map(card).join(""):'<div class="empty">Ничего не найдено</div>';
  renderCmp();
}

function renderCmp(){
  const items=DATA.filter(x=>SEL.has(x.id));
  const box=$("cmpbox");
  if(!items.length){box.style.display="none";return}
  box.style.display="block";
  const minP=Math.min(...items.map(x=>x.price)), maxB=Math.max(...items.map(x=>x.battery));
  const names=[],seen=new Set();
  items.forEach(x=>x.specs.forEach(s=>{if(!seen.has(s.name)){seen.add(s.name);names.push(s.name)}}));
  const only=$("onlydiff")?$("onlydiff").checked:true;
  let rows=`<tr><td class="k">Модель</td>${items.map(x=>`<td><b>${esc(x.title)}</b></td>`).join("")}</tr>
    <tr><td class="k">Цена</td>${items.map(x=>`<td class="${x.price===minP&&items.length>1?"best":""}">${fmt(x.price)}</td>`).join("")}</tr>
    <tr><td class="k">Батарея</td>${items.map(x=>`<td class="${x.battery===maxB&&items.length>1?"best":""}">${x.battery} мАч</td>`).join("")}</tr>
    <tr><td class="k">Рейтинг</td>${items.map(x=>`<td>${x.rating||"—"}</td>`).join("")}</tr>`;
  names.forEach(n=>{
    const vals=items.map(x=>spec(x,n));
    if(only&&items.length>1&&new Set(vals).size===1)return;
    if(n==="Емкость аккумулятора")return;
    rows+=`<tr><td class="k">${esc(n)}</td>${vals.map(v=>`<td>${esc(v)||"—"}</td>`).join("")}</tr>`;
  });
  box.innerHTML=`<h2><span>Сравнение (${items.length})</span><span><label style="font-size:12.5px;color:var(--mut)"><input type="checkbox" id="onlydiff" ${only?"checked":""}> только отличия</label> <button class="btn" id="clr">Сбросить</button></span></h2><div class="tw"><table>${rows}</table></div>`;
  $("onlydiff").onchange=renderCmp;
  $("clr").onclick=()=>{SEL.clear();render()};
}

$("list").addEventListener("click",e=>{
  const c=e.target.closest(".card"); if(!c)return;
  const id=c.dataset.id;
  if(e.target.dataset.act==="det"){OPEN.has(id)?OPEN.delete(id):OPEN.add(id);c.querySelector(".specs").classList.toggle("open")}
});
$("list").addEventListener("change",e=>{
  if(e.target.dataset.act!=="cmp")return;
  const id=e.target.closest(".card").dataset.id;
  if(e.target.checked){if(SEL.size>=4){e.target.checked=false;alert("Максимум 4 модели для сравнения");return}SEL.add(id)}else SEL.delete(id);
  renderCmp();
});
["q","brand","ram","pmin","pmax","sort"].forEach(id=>$(id).addEventListener("input",render));
load();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
